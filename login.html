<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - My App</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav class="navbar">
        <div class="navbar-container">
            <a href="index.html" class="navbar-logo">MyApp</a>
            <ul class="nav-menu">
                <li class="nav-item">
                    <a href="index.html" class="nav-link">Home</a>
                </li>
                <li class="nav-item">
                    <a href="about.html" class="nav-link">About</a>
                </li>
                <li class="nav-item" id="auth-item">
                    <a href="login.html" class="nav-link active" id="auth-link">Sign In</a>
                </li>
            </ul>
        </div>
    </nav>

    <div class="container">
        <div class="login-wrapper">
            <div class="login-card">
                <h1>Sign In</h1>
                <p class="login-subtitle">Welcome back! Please sign in to your account</p>

                <form id="login-form" class="login-form">
                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <input 
                            type="email" 
                            id="email" 
                            name="email" 
                            placeholder="Enter your email" 
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="password">Password</label>
                        <input 
                            type="password" 
                            id="password" 
                            name="password" 
                            placeholder="Enter your password" 
                            required
                        >
                    </div>

                    <div class="form-group checkbox">
                        <input 
                            type="checkbox" 
                            id="remember" 
                            name="remember"
                        >
                        <label for="remember">Remember me</label>
                    </div>

                    <button type="submit" class="btn btn-primary btn-block">Sign In</button>

                    <div id="login-message" class="login-message"></div>
                </form>

                <div class="login-footer">
                    <p>Don't have an account? <a href="#" class="link">Sign up here</a></p>
                    <p><a href="#" class="link">Forgot your password?</a></p>
                </div>
            </div>
        </div>
    </div>

    <footer class="footer">
        <p>&copy; 2024 MyApp. All rights reserved.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
